<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador — Cayi Studio Web</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="js/content-defaults.js"></script>
<style>
  :root{
    --font-display:'Bricolage Grotesque', ui-sans-serif, sans-serif;
    --font-body:'Manrope', system-ui, sans-serif;
    --ink:#121212; --ink-soft:#6B6B6B; --ink-faint:#9A9A9A;
    --orange:#EF8B3C; --orange-dark:#B85F1D; --orange-tint:#FBE3C6;
    --pink:#C81760; --teal:#1C8C7C;
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F6F6;
    --border:#E5E5E5;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5;}
  h1,h2,h3,.brand,button{font-family:var(--font-display);}
  [hidden]{display:none !important;}

  /* ---------- lock ---------- */
  #lock{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--ink); z-index:1000; padding:20px;}
  .lock-card{background:var(--surface); border-radius:20px; padding:36px 30px; width:100%; max-width:360px; box-shadow:var(--shadow); text-align:center;}
  .lock-logo{font-size:30px; font-weight:800; margin-bottom:4px;}
  .lock-logo .ca{color:var(--ink);} .lock-logo .yi{color:var(--orange); font-style:italic;}
  .lock-sub{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:26px;}
  #lock-form{display:flex; flex-direction:column; gap:12px;}
  #lock-pass{padding:13px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg); font-size:15px; text-align:center;}
  .lock-btn{padding:13px 14px; border-radius:12px; border:none; cursor:pointer; font-weight:700; font-size:15px; color:#fff; background:var(--orange);}
  .lock-error{color:#B23A48; font-size:13px; min-height:18px;}

  /* ---------- app ---------- */
  #app{max-width:880px; margin:0 auto; padding:24px 20px 120px;}
  .topbar{position:sticky; top:0; z-index:50; background:var(--ink); color:#fff; margin:-24px -20px 28px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .topbar .brand{font-weight:800; font-size:18px;}
  .topbar .brand .yi{color:var(--orange); font-style:italic;}
  .topbar-actions{display:flex; align-items:center; gap:10px;}
  #saveStatus{font-size:12.5px; color:#ABABAB;}
  #saveBtn{background:var(--orange); color:var(--ink); border:none; padding:10px 20px; border-radius:999px; font-weight:700; cursor:pointer;}
  #saveBtn:disabled{opacity:.6; cursor:default;}
  #viewSiteLink{color:#FAFAFA; font-size:13px; text-decoration:underline;}

  .config-note{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:16px 18px; font-size:13.5px; color:var(--ink-soft); margin-bottom:24px;}

  details.section{background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:16px; box-shadow:var(--shadow); overflow:hidden;}
  details.section summary{cursor:pointer; padding:18px 20px; font-family:var(--font-display); font-weight:700; font-size:16px; list-style:none; display:flex; align-items:center; justify-content:space-between;}
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:"+"; font-size:20px; color:var(--ink-faint);}
  details.section[open] summary::after{content:"–";}
  .section-body{padding:0 20px 20px;}

  .item-block{border-top:1px solid var(--border); padding:16px 0;}
  .item-block:first-child{border-top:none;}
  .item-title{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:10px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-weight:700; font-size:13px; margin-bottom:5px;}
  .field input[type=text], .field input[type=email], .field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg);
    font-family:inherit; font-size:14.5px; color:var(--ink);
  }
  .field textarea{min-height:70px; resize:vertical;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--orange);}
  .field input[type=color]{width:56px; height:36px; border:1.5px solid var(--border); border-radius:8px; padding:2px; background:var(--surface);}

  .media-row{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .media-row input[type=text]{flex:1; min-width:180px;}
  .upload-btn{background:var(--surface-2); border:1.5px solid var(--border); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .upload-btn:hover{border-color:var(--orange);}
  .media-preview{width:56px; height:56px; border-radius:8px; object-fit:cover; border:1px solid var(--border); background:var(--bg); flex-shrink:0;}
  .upload-status{font-size:12px; color:var(--ink-faint); width:100%;}
</style>
</head>
<body>

<!-- ===================== LOCK ===================== -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo"><span class="ca">Ca</span><span class="yi">yi</span></div>
    <div class="lock-sub">Administrador de la web</div>
    <form id="lock-form">
      <input id="lock-pass" type="password" placeholder="Contraseña" autocomplete="off" autofocus>
      <button class="lock-btn" type="submit">Entrar</button>
      <p class="lock-error" id="lock-error"></p>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <div class="topbar">
    <span class="brand"><span class="ca">Ca</span><span class="yi">yi</span> Admin</span>
    <div class="topbar-actions">
      <a id="viewSiteLink" href="index.html" target="_blank">Ver la web ↗</a>
      <span id="saveStatus"></span>
      <button id="saveBtn" type="button">Guardar cambios</button>
    </div>
  </div>

  <div class="config-note" id="configNote" hidden>
    ⚠️ Falta configurar Supabase en <code>supabase-config.js</code>. Este panel no puede guardar cambios todavía — sigue los pasos del README.md.
  </div>

  <div id="sections"></div>
</div>

<script>
// ==================================================================
// Definición del formulario — un solo lugar describe qué campos hay
// ==================================================================
var SECTIONS = [
  { key: 'hero', label: 'Héroe (Inicio)', type: 'object', fields: [
      { name: 'eyebrow', label: 'Texto del botón pequeño', type: 'text' },
      { name: 'title', label: 'Título principal (puedes usar &lt;br&gt; para salto de línea y &lt;strong&gt;texto&lt;/strong&gt;)', type: 'textarea' },
      { name: 'p1', label: 'Párrafo 1 (puedes usar &lt;strong&gt;texto&lt;/strong&gt;)', type: 'textarea' },
      { name: 'p2', label: 'Párrafo 2', type: 'textarea' },
      { name: 'media', label: 'Video del héroe (reel destacado, se reproduce en automático) o imagen', type: 'media' }
  ]},
  { key: 'portfolio', label: 'Portafolio', type: 'array', itemLabel: function(i){ return 'Proyecto ' + (i+1); }, fields: [
      { name: 'title', label: 'Título', type: 'text' },
      { name: 'client', label: 'Cliente', type: 'text' },
      { name: 'image', label: 'Imagen', type: 'media' }
  ]},
  { key: 'services', label: 'Servicios', type: 'array', itemLabel: function(i){ return 'Servicio ' + (i+1); }, fields: [
      { name: 'title', label: 'Título', type: 'text' },
      { name: 'desc', label: 'Descripción', type: 'textarea' }
  ]},
  { key: 'about', label: 'Nosotros', type: 'object', fields: [
      { name: 'title', label: 'Título', type: 'text' },
      { name: 'p1', label: 'Párrafo 1 (puedes usar &lt;strong&gt;texto&lt;/strong&gt;)', type: 'textarea' },
      { name: 'p2', label: 'Párrafo 2', type: 'textarea' },
      { name: 'image', label: 'Foto del equipo', type: 'media' }
  ]},
  { key: 'testimonials', label: 'Testimonios', type: 'array', itemLabel: function(i){ return 'Testimonio ' + (i+1); }, fields: [
      { name: 'quote', label: 'Cita (sin comillas, se agregan solas)', type: 'textarea' },
      { name: 'name', label: 'Nombre', type: 'text' },
      { name: 'role', label: 'Cargo / Empresa', type: 'text' }
  ]},
  { key: 'clients', label: 'Clientes', type: 'array', itemLabel: function(i){ return 'Cliente ' + (i+1); }, fields: [
      { name: 'name', label: 'Nombre (se muestra si no subes logo)', type: 'text' },
      { name: 'logo', label: 'Logo (opcional)', type: 'media' }
  ]},
  { key: 'contact', label: 'Contacto', type: 'object', fields: [
      { name: 'phone', label: 'Teléfono', type: 'text' },
      { name: 'email', label: 'Email', type: 'text' },
      { name: 'address', label: 'Ciudad / dirección', type: 'text' },
      { name: 'instagram', label: 'URL de Instagram', type: 'text' },
      { name: 'facebook', label: 'URL de Facebook', type: 'text' },
      { name: 'tiktok', label: 'URL de TikTok', type: 'text' }
  ]},
  { key: 'colors', label: 'Colores de marca', type: 'object', fields: [
      { name: 'ink', label: 'Ink (header, footer, fondos oscuros)', type: 'color' },
      { name: 'orange', label: 'Naranja (acento principal)', type: 'color' },
      { name: 'pink', label: 'Rosa (detalles pequeños)', type: 'color' },
      { name: 'teal', label: 'Teal (botón "Ver Portafolio")', type: 'color' }
  ]}
];

// ⚠️ Cambia esta contraseña y sube el cambio a GitHub para que se actualice.
var PASSCODE = "CayiWeb2026";

// ==================================================================
// Construcción del formulario
// ==================================================================
function fieldId(sectionKey, index, fieldName) {
  return index === null ? sectionKey + '.' + fieldName : sectionKey + '.' + index + '.' + fieldName;
}

function renderField(sectionKey, index, field) {
  var id = fieldId(sectionKey, index, field.name);
  var html = '<div class="field">';
  html += '<label for="' + id + '">' + field.label + '</label>';
  if (field.type === 'textarea') {
    html += '<textarea id="' + id + '" data-field="' + id + '"></textarea>';
  } else if (field.type === 'color') {
    html += '<input type="color" id="' + id + '" data-field="' + id + '">';
  } else if (field.type === 'media') {
    html += '<div class="media-row">';
    html += '<img class="media-preview" id="' + id + '__preview" alt="">';
    html += '<input type="text" id="' + id + '" data-field="' + id + '" placeholder="URL de imagen/video, o sube un archivo">';
    html += '<button type="button" class="upload-btn" data-upload-target="' + id + '">Subir archivo</button>';
    html += '<input type="file" accept="image/*,video/*" style="display:none" id="' + id + '__file">';
    html += '<span class="upload-status" id="' + id + '__status"></span>';
    html += '</div>';
  } else {
    html += '<input type="text" id="' + id + '" data-field="' + id + '">';
  }
  html += '</div>';
  return html;
}

function renderSection(section) {
  var body = '';
  if (section.type === 'object') {
    body += section.fields.map(function (f) { return renderField(section.key, null, f); }).join('');
  } else {
    var count = (window.CAYI_DEFAULT_CONTENT[section.key] || []).length;
    for (var i = 0; i < count; i++) {
      body += '<div class="item-block"><div class="item-title">' + section.itemLabel(i) + '</div>';
      body += section.fields.map(function (f) { return renderField(section.key, i, f); }).join('');
      body += '</div>';
    }
  }
  return (
    '<details class="section"><summary>' + section.label + '</summary>' +
    '<div class="section-body">' + body + '</div></details>'
  );
}

document.getElementById('sections').innerHTML = SECTIONS.map(renderSection).join('');

// ==================================================================
// Leer / escribir valores del formulario <-> objeto de contenido
// ==================================================================
function pathGet(obj, path) {
  return path.split('.').reduce(function (o, k) { return (o == null) ? undefined : o[k]; }, obj);
}
function pathSet(obj, path, value) {
  var parts = path.split('.');
  var cur = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    var key = parts[i];
    if (cur[key] == null) cur[key] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[key];
  }
  cur[parts[parts.length - 1]] = value;
}

function populateForm(content) {
  document.querySelectorAll('[data-field]').forEach(function (el) {
    var value = pathGet(content, el.dataset.field);
    if (value == null) return;
    el.value = value;
    if (el.type === 'text' && el.id.indexOf('__') === -1) {
      var preview = document.getElementById(el.id + '__preview');
      if (preview) { if (value) preview.src = value; else preview.removeAttribute('src'); }
    }
  });
}

function collectForm() {
  var content = {};
  document.querySelectorAll('[data-field]').forEach(function (el) {
    pathSet(content, el.dataset.field, el.value);
  });
  return content;
}

// ==================================================================
// Supabase: cargar, guardar, subir archivos
// ==================================================================
var url = window.SUPABASE_URL, key = window.SUPABASE_ANON_KEY;
var configured = url && key && url.indexOf('tu-proyecto') === -1;
var client = configured ? window.supabase.createClient(url, key) : null;

if (!configured) document.getElementById('configNote').hidden = false;

function loadContent() {
  if (!client) { populateForm(window.CAYI_DEFAULT_CONTENT); return; }
  client.from('cayi_web_content').select('data').eq('id', 1).single().then(function (res) {
    var saved = (res.data && res.data.data) || {};
    populateForm(window.CAYI_mergeContent(saved));
  });
}

var saveBtn = document.getElementById('saveBtn');
var saveStatus = document.getElementById('saveStatus');

saveBtn.addEventListener('click', function () {
  if (!client) { saveStatus.textContent = 'Configura Supabase primero (ver README.md)'; return; }
  saveBtn.disabled = true;
  saveStatus.textContent = 'Guardando…';
  var content = window.CAYI_mergeContent(collectForm());
  client.from('cayi_web_content').update({ data: content, updated_at: new Date().toISOString() }).eq('id', 1)
    .then(function (res) {
      saveBtn.disabled = false;
      if (res.error) { saveStatus.textContent = 'Error al guardar'; console.error(res.error); return; }
      saveStatus.textContent = 'Guardado ✓ — ya está en vivo en la web';
      setTimeout(function () { saveStatus.textContent = ''; }, 4000);
    });
});

document.getElementById('sections').addEventListener('click', function (e) {
  var btn = e.target.closest('.upload-btn');
  if (!btn) return;
  var targetId = btn.dataset.uploadTarget;
  document.getElementById(targetId + '__file').click();
});

document.getElementById('sections').addEventListener('change', function (e) {
  if (!e.target.matches('input[type=file]')) return;
  if (!client) { alert('Configura Supabase primero (ver README.md) para poder subir archivos.'); return; }
  var fileInput = e.target;
  var baseId = fileInput.id.replace('__file', '');
  var urlInput = document.getElementById(baseId);
  var statusEl = document.getElementById(baseId + '__status');
  var previewEl = document.getElementById(baseId + '__preview');
  var file = fileInput.files[0];
  if (!file) return;

  statusEl.textContent = 'Subiendo…';
  var ext = file.name.split('.').pop();
  var path = baseId.replace(/\./g, '-') + '-' + Date.now() + '.' + ext;

  client.storage.from('cayi-web-assets').upload(path, file, { upsert: true, cacheControl: '3600' })
    .then(function (res) {
      if (res.error) { statusEl.textContent = 'Error al subir'; console.error(res.error); return; }
      var pub = client.storage.from('cayi-web-assets').getPublicUrl(path);
      urlInput.value = pub.data.publicUrl;
      if (previewEl) previewEl.src = pub.data.publicUrl;
      statusEl.textContent = 'Subido ✓';
      setTimeout(function () { statusEl.textContent = ''; }, 3000);
    });
});

// ==================================================================
// Contraseña
// ==================================================================
document.getElementById('lock-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var val = document.getElementById('lock-pass').value;
  if (val === PASSCODE) {
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').hidden = false;
    loadContent();
  } else {
    document.getElementById('lock-error').textContent = 'Contraseña incorrecta';
  }
});
</script>
</body>
</html>
